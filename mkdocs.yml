site_name: Documentación MRCDD - Evaluación de Contenidos Digitales
site_description: Documentación técnica y pedagógica de la aplicación de evaluación de la competencia digital docente en el Área 2 del MRCDD.
site_author: Gonzalo Vega Pérez
site_url: https://gonvga.github.io/tfm-cdd-evaluacion/

repo_name: tfm-cdd-evaluacion
repo_url: https://github.com/gonvga/tfm-cdd-evaluacion
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Inicio: index.md
  - Arquitectura: arquitectura.md
  - Desarrollo de pruebas: desarrollo-pruebas.md
  - Competencia 2.1: competencia-21.md
  - Instalación y estado actual: instalacion.md
